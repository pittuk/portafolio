      <stop offset="0%" stop-color="#00c2a8" stop-opacity="0.28" />
      <stop offset="65%" stop-color="#00c2a8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bloomOrange" cx="8%" cy="5%" r="45%">
